name: Release QuickFlash

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version. Accepts 1.2.3 or v1.2.3.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.normalize_version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize version input
        id: normalize_version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${INPUT_VERSION}" >&2
            exit 1
          fi

          echo "release_version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "release_name=v${version}" >> "$GITHUB_OUTPUT"

      - name: Ensure Spotify client ID secret exists
        shell: bash
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
        run: |
          if [[ -z "$VITE_SPOTIFY_CLIENT_ID" ]]; then
            echo "GitHub secret VITE_SPOTIFY_CLIENT_ID is required." >&2
            exit 1
          fi

      - name: Verify release version matches source files
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.normalize_version.outputs.release_version }}
        run: |
          node - <<'EOF'
          const fs = require('fs');

          const expectedVersion = process.env.RELEASE_VERSION;
          const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const tauriVersion = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const cargoToml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoMatch = cargoToml.match(/^version\s*=\s*"([^"]+)"/m);

          if (!cargoMatch) {
            console.error('Unable to read version from src-tauri/Cargo.toml.');
            process.exit(1);
          }

          const cargoVersion = cargoMatch[1];

          if (
            packageVersion !== expectedVersion ||
            tauriVersion !== expectedVersion ||
            cargoVersion !== expectedVersion
          ) {
            console.error(
              `Version mismatch. expected=${expectedVersion} package=${packageVersion} tauri=${tauriVersion} cargo=${cargoVersion}`
            );
            process.exit(1);
          }
          EOF

      - name: Ensure tag does not already exist
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.normalize_version.outputs.release_tag }}
        run: |
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists." >&2
            exit 1
          fi

      - name: Create release body
        id: release_body
        shell: bash
        run: |
          body_file="$RUNNER_TEMP/release-body.md"
          cat <<'EOF' > "$body_file"
          Automatic release for QuickFlash.

          macOS Apple Silicon build is unsigned. If Gatekeeper blocks it, remove the quarantine flag before opening:

          xattr -cr /Applications/QuickFlash.app
          EOF

          {
            echo 'release_body<<EOF'
            cat "$body_file"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create tag
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.normalize_version.outputs.release_tag }}
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${process.env.RELEASE_TAG}`,
              sha: context.sha
            });

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.normalize_version.outputs.release_tag }}
          name: ${{ steps.normalize_version.outputs.release_name }}
          body: ${{ steps.release_body.outputs.release_body }}
          generate_release_notes: true
          draft: false
          prerelease: false

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --no-sign
    env:
      VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app and upload release assets
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
        with:
          tagName: ${{ needs.prepare.outputs.release_tag }}
          releaseDraft: false
          args: ${{ matrix.args }}
